[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Use portable DSP: the bundled ESP-DSP assembly is incompatible with
; the installed ESP32 toolchain's assembly header search paths.
build_flags =
    -DEIDSP_USE_ESP_DSP=0

; Add your dependencies here:
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit ADXL345
    adafruit/Adafruit Unified Sensor

[env:wokwi]
board = esp32dev
build_flags = ${env.build_flags} -D ENV_WOKWI

[env:wokwi-data-stream]
board = esp32dev
build_flags = ${env.build_flags} -D ENV_WOKWI -D DATA_STREAM

[env:real]
board = esp32doit-devkit-v1
build_flags = ${env.build_flags} -D ENV_REAL

[env:real-data-stream]
board = esp32doit-devkit-v1
build_flags = ${env.build_flags} -D ENV_REAL -D DATA_STREAM
